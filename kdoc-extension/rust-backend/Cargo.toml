[package]
name = "kdoc-ai-backend"
version = "0.1.0"
edition = "2021"
description = "Cross-platform AI backend for KDoc editor (GGUF)"

[[bin]]
name = "kdoc-ai"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Kocal AI runtime — MLX backend for Bonsai 1-bit models
kchat-generation = { path = "../../../kocal/kchat-ai-runtime/crates/kchat-generation", features = ["mlx"] }
kchat-core = { path = "../../../kocal/kchat-ai-runtime/crates/kchat-core" }

[features]
default = []
gguf = []
all = []

[profile.release]
opt-level = 3
lto = true
strip = true
